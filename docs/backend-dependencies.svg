<svg xmlns="http://www.w3.org/2000/svg" width="680" height="496" viewBox="0 0 680 496" font-family="Segoe UI, Sarabun, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .internal { fill: #EEEDFE; stroke: #534AB7; }
      .npm      { fill: #E1F5EE; stroke: #0F6E56; }
      .builtin  { fill: #F1EFE8; stroke: #5F5E5A; }
      .file     { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
      rect { stroke-width: 0.8; }
      .title { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .sub   { font-size: 12px; text-anchor: middle; }
      .legend { font-size: 12px; fill: #5F5E5A; }
      .arr { stroke: #5F5E5A; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="680" height="496" fill="#FFFFFF"/>

  <!-- Entry -->
  <rect class="internal" x="240" y="40" width="200" height="56" rx="4"/>
  <text class="title" x="340" y="63" fill="#3C3489">server.js</text>
  <text class="sub" x="340" y="82" fill="#534AB7">Entry: REST + Socket.IO</text>

  <!-- Dependencies of server.js -->
  <rect class="builtin" x="40" y="160" width="130" height="56" rx="4"/>
  <text class="title" x="105" y="183" fill="#444441">Node built-in</text>
  <text class="sub" x="105" y="202" fill="#5F5E5A">http, path</text>

  <rect class="npm" x="190" y="160" width="130" height="56" rx="4"/>
  <text class="title" x="255" y="183" fill="#085041">express</text>
  <text class="sub" x="255" y="202" fill="#0F6E56">REST API, static</text>

  <rect class="npm" x="340" y="160" width="130" height="56" rx="4"/>
  <text class="title" x="405" y="183" fill="#085041">socket.io</text>
  <text class="sub" x="405" y="202" fill="#0F6E56">Realtime events</text>

  <rect class="internal" x="490" y="160" width="150" height="56" rx="4"/>
  <text class="title" x="565" y="183" fill="#3C3489">src/sla.js</text>
  <text class="sub" x="565" y="202" fill="#534AB7">SLA, assign, escalate</text>

  <!-- Data layer -->
  <rect class="internal" x="490" y="290" width="150" height="56" rx="4"/>
  <text class="title" x="565" y="313" fill="#3C3489">src/store.js</text>
  <text class="sub" x="565" y="332" fill="#534AB7">Data layer</text>

  <rect class="builtin" x="300" y="400" width="150" height="56" rx="4"/>
  <text class="title" x="375" y="423" fill="#444441">Node built-in</text>
  <text class="sub" x="375" y="442" fill="#5F5E5A">fs, path, crypto</text>

  <rect class="file" x="490" y="400" width="150" height="56" rx="4"/>
  <text class="title" x="565" y="423" fill="#2C2C2A">data/db.json</text>
  <text class="sub" x="565" y="442" fill="#5F5E5A">Persisted state</text>

  <!-- Arrows -->
  <line class="arr" x1="270" y1="96" x2="112" y2="158"/>
  <line class="arr" x1="310" y1="96" x2="258" y2="158"/>
  <line class="arr" x1="370" y1="96" x2="402" y2="158"/>
  <line class="arr" x1="420" y1="96" x2="556" y2="158"/>
  <path class="arr" d="M440 68 H662 V318 H642"/>
  <line class="arr" x1="565" y1="216" x2="565" y2="288"/>
  <line class="arr" x1="520" y1="346" x2="390" y2="398"/>
  <line class="arr" x1="565" y1="346" x2="565" y2="398" stroke-dasharray="4 3"/>

  <!-- Legend -->
  <rect class="internal" x="40" y="292" width="14" height="14" rx="3"/><text class="legend" x="62" y="304">Internal module</text>
  <rect class="npm" x="40" y="318" width="14" height="14" rx="3"/><text class="legend" x="62" y="330">npm package</text>
  <rect class="builtin" x="40" y="344" width="14" height="14" rx="3"/><text class="legend" x="62" y="356">Node built-in</text>
  <rect class="file" x="40" y="370" width="14" height="14" rx="3"/><text class="legend" x="62" y="382">Data file (read/write)</text>
</svg>
